name: Build Signed APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (signed with debug key)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (signed with release key)
        run: ./gradlew assembleRelease --stacktrace

      - name: List APK outputs
        run: |
          echo "=== Debug APK ==="
          ls -la app/build/outputs/apk/debug/
          echo "=== Release APK ==="
          ls -la app/build/outputs/apk/release/

      - name: Rename APKs for clarity
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AppSweep-v1.1.0-debug.apk || true
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/AppSweep-v1.1.0-release.apk || true

      - name: Verify APK signing
        run: |
          echo "=== Verifying Debug APK ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk || echo "Using alternative verification..."
          unzip -l app/build/outputs/apk/debug/app-debug.apk | head -5
          echo ""
          echo "=== Verifying Release APK ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk || echo "Using alternative verification..."
          unzip -l app/build/outputs/apk/release/app-release.apk | head -5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AppSweep-debug-signed
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AppSweep-release-signed
          path: app/build/outputs/apk/release/*.apk
